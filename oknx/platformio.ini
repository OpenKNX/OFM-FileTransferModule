; ┬────┴  OFM-FileTransferModule / oknx
; ■ KNX   2026 OpenKNX - Erkan Çolak
;
; Native desktop build of the FTC host client `oknx` via PlatformIO (platform = native).
;
; ONE `pio run` builds the WHOLE desktop matrix: the env NAME selects the target (oknx-<os>-<arch>),
; and the pre-build hook scripts/pio_zig_cross.py makes pio itself pull the cross-toolchain:
;   * macOS targets  -> host clang with -arch + the Xcode SDK.
;   * Linux/Windows  -> `zig`, downloaded once into the shared PlatformIO core cache
;     ($PROJECT_CORE_DIR/.cache/oknx-zig); the hook writes cc/c++/ar/ranlib wrappers that exec
;     `zig cc|c++ -target <triple>` and points SCons at them.
; Each build lands in .pio/build/<env>/oknx[.exe]. A single POSIX (mac) `pio run` covers every target.
;
; src_dir points at the MODULE ROOT (one level up) so the two UNCHANGED client sources live inside the
; scanned tree and can be selected with build_src_filter -- the shared module lib itself is not modified.

[platformio]
src_dir = ${PROJECT_DIR}/..
default_envs =
    oknx-macos-arm64
    oknx-macos-x64
    oknx-linux-x64
    oknx-linux-arm64
    oknx-linux-armhf
    oknx-windows-x86
    oknx-windows-x64
    oknx-windows-arm64

; --- shared base: all envs are identical except their NAME (which selects the target in the hook) ---
[oknx_base]
platform = native
extra_scripts = pre:scripts/pio_zig_cross.py
build_src_filter =
    +<src/FileTransferClient.cpp>
    +<src/FirmwarePatch.cpp>
    +<src/FileTransferClientConsole.cpp>
    +<oknx/src/main.cpp>
    +<oknx/src/knx_ip_tunnel.cpp>
    +<oknx/shim/shim.cpp>
    +<oknx/src/third_party/miniz.c>
    +<../knx/src/knx/aes.c>
    ; the stack's own DPT converter, so a decoded value cannot differ between device and tool.
    ; Self-contained: dptconvert -> dpt + knx_value + bits.h, no BAU, no stack, no clash with the shim.
    +<../knx/src/knx/dptconvert.cpp>
    +<../knx/src/knx/dpt.cpp>
    +<../knx/src/knx/knx_value.cpp>
build_flags =
    -std=c++17
    -DOPENKNX_FTC_PROFILE_MANAGER
    -DOPENKNX_FTC_CLIENT
    -DOPENKNX_FTC_CONSOLE
    -DOPENKNX_FTC_DELTA_UPDATE
    -DFTC_HOST_BUILD                 ; this is the PC tool, not a device: usage lines name `oknx`
    -DMODULE_FileTransferModule_Version=\"0.2.0\"
    ; select miniz's 64-bit file-I/O path on glibc (fopen64/ftello64) -> real large-file support,
    ; silences the "may not support large files" #pragma on the zig linux cross builds.
    -D_LARGEFILE64_SOURCE
    -D_FILE_OFFSET_BITS=64
    -I${PROJECT_DIR}/../../knx/src   ; the stack's DPT converter, included as knx/dptconvert.h
    -I${PROJECT_DIR}/shim
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../src
    -I${PROJECT_DIR}/../../knx/src
    -Wall
    -Wextra
    -Wno-unused-parameter

[env:oknx-macos-arm64]
extends = oknx_base

[env:oknx-macos-x64]
extends = oknx_base

[env:oknx-linux-x64]
extends = oknx_base

[env:oknx-linux-arm64]
extends = oknx_base

[env:oknx-linux-armhf]
extends = oknx_base

[env:oknx-windows-x86]
extends = oknx_base
build_flags = ${oknx_base.build_flags} -include ${PROJECT_DIR}/shim/win_compat.h

[env:oknx-windows-x64]
extends = oknx_base
build_flags = ${oknx_base.build_flags} -include ${PROJECT_DIR}/shim/win_compat.h

[env:oknx-windows-arm64]
extends = oknx_base
build_flags = ${oknx_base.build_flags} -include ${PROJECT_DIR}/shim/win_compat.h
