; ┬────┴  OFM-FileTransferModule / ftc-cli
; ■ KNX   2026 OpenKNX - Erkan Çolak
;
; Native desktop build of the FTC ftc-cli via PlatformIO (platform = native).
;
; ONE `pio run` builds the WHOLE desktop matrix: the env NAME selects the target (ftc-cli-<os>-<arch>),
; and the pre-build hook scripts/pio_zig_cross.py makes pio itself pull the cross-toolchain:
;   * macOS targets  -> host clang with -arch + the Xcode SDK.
;   * Linux/Windows  -> `zig`, downloaded once into the shared PlatformIO core cache
;     ($PROJECT_CORE_DIR/.cache/ftc-cli-zig); the hook writes cc/c++/ar/ranlib wrappers that exec
;     `zig cc|c++ -target <triple>` and points SCons at them.
; Each build lands in .pio/build/<env>/ftc[.exe]. A single POSIX (mac) `pio run` covers every target.
;
; src_dir points at the MODULE ROOT (one level up) so the two UNCHANGED client sources live inside the
; scanned tree and can be selected with build_src_filter -- the shared module lib itself is not modified.

[platformio]
src_dir = ${PROJECT_DIR}/..
default_envs =
    ftc-cli-macos-arm64
    ftc-cli-macos-x64
    ftc-cli-linux-x64
    ftc-cli-linux-arm64
    ftc-cli-linux-armhf
    ftc-cli-windows-x86
    ftc-cli-windows-x64
    ftc-cli-windows-arm64

; --- shared base: all envs are identical except their NAME (which selects the target in the hook) ---
[ftc_base]
platform = native
extra_scripts = pre:scripts/pio_zig_cross.py
build_src_filter =
    +<src/FileTransferClient.cpp>
    +<src/FirmwarePatch.cpp>
    +<src/FileTransferClientConsole.cpp>
    +<ftc-cli/src/main.cpp>
    +<ftc-cli/src/knx_ip_tunnel.cpp>
    +<ftc-cli/shim/shim.cpp>
    +<ftc-cli/src/third_party/miniz.c>
    +<../knx/src/knx/aes.c>
build_flags =
    -std=c++17
    -DOPENKNX_FTC_PROFILE_MANAGER
    -DOPENKNX_FTC_CLIENT
    -DOPENKNX_FTC_CONSOLE
    -DOPENKNX_FTC_DELTA_UPDATE
    -DMODULE_FileTransferModule_Version=\"0.2.0\"
    ; select miniz's 64-bit file-I/O path on glibc (fopen64/ftello64) -> real large-file support,
    ; silences the "may not support large files" #pragma on the zig linux cross builds.
    -D_LARGEFILE64_SOURCE
    -D_FILE_OFFSET_BITS=64
    -I${PROJECT_DIR}/shim
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../src
    -I${PROJECT_DIR}/../../knx/src
    -Wall
    -Wextra
    -Wno-unused-parameter

[env:ftc-cli-macos-arm64]
extends = ftc_base

[env:ftc-cli-macos-x64]
extends = ftc_base

[env:ftc-cli-linux-x64]
extends = ftc_base

[env:ftc-cli-linux-arm64]
extends = ftc_base

[env:ftc-cli-linux-armhf]
extends = ftc_base

[env:ftc-cli-windows-x86]
extends = ftc_base

[env:ftc-cli-windows-x64]
extends = ftc_base

[env:ftc-cli-windows-arm64]
extends = ftc_base
